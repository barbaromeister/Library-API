spring.application.name=library-api

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/kutuphane}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET:dev-secret-change-me-this-key-must-be-at-least-32-bytes-long-for-hs256-algorithm}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS (comma-separated origin patterns; supports localhost:*)
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Google Books API (optional)
google.books.api.key=${GOOGLE_BOOKS_API_KEY:}

# Logging
logging.level.com.library.libraryapi=DEBUG
logging.level.org.springframework.security=INFO
